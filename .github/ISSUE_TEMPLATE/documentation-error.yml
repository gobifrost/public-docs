name: Documentation error
description: Report an incorrect, unclear, or outdated documentation page.
title: "docs: "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, customer data, or other sensitive information.
  - type: input
    id: page
    attributes:
      label: Page URL or path
      description: Link the page or name the source path.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: State the incorrect or unclear content and its reader impact.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Provide the product behavior, version, or source that supports the correction.
    validations:
      required: true
  - type: textarea
    id: proposed-change
    attributes:
      label: Proposed correction
      description: Suggest wording, structure, or an example if you have one.
